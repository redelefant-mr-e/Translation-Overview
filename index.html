<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translation Overview</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: #0f0f10; color: #f2f2f2; }
      .container { max-width: 1280px; margin: 0 auto; padding: 32px 28px; }
      h1 { font-size: 20px; line-height: 28px; letter-spacing: 0.2px; margin: 0 0 12px 0; }
      .muted { color: #9aa0a6; font-size: 12px; }

      /* Tabs */
      .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 20px 0; }
      .tab { padding: 10px 14px; border: 1px solid #2a2d32; border-radius: 8px; cursor: pointer; background: #141518; color: #e6e6e6; font-size: 13px; }
      .tab:hover { background: #17191d; }
      .tab.active { background: #1b1d22; border-color: #3a3f46; }

      /* Toolbar */
      .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin: 14px 0 16px 0; }
      .search { min-width: 320px; max-width: 860px; }
      input[type="text"] { width: 100%; padding: 10px 12px; background: #0f1012; color: #f2f2f2; border: 1px solid #2a2d32; border-radius: 8px; font-size: 13px; }
      .right { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
      .right label { color: #c9cccf; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; user-select: none; }
      .right input[type="checkbox"] { width: 16px; height: 16px; accent-color: #6b7785; }
      a.button { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #2a2d32; border-radius: 8px; color: #e6e6e6; text-decoration: none; background: #141518; font-size: 13px; white-space: nowrap; }
      a.button:hover { background: #17191d; }

      /* Table */
      .table-wrap { overflow: auto; max-height: 72vh; border: 1px solid #22252a; border-radius: 10px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border-bottom: 1px solid #1b1e23; padding: 10px 12px; text-align: left; vertical-align: top; }
      th { position: sticky; top: 0; background: #0f0f10; z-index: 1; font-weight: 600; color: #c9cccf; }
      td { color: #e8e9ea; }

      .badge { border: 1px solid #2f3339; padding: 2px 8px; border-radius: 999px; font-size: 12px; color: #c9cccf; background: #121317; }
    </style>
